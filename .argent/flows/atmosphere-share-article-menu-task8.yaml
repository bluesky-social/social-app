executionPrerequisite: >-
  Instrumented signed-in English iOS app at the top of Atmosphere, browser
  preference unset. Local feed contains a standalone share with a valid document
  URL and hydrated document author.
steps:
  - echo: Open the external article, cancel the browser prompt, then visit its author through the independent menu.
  - scroll-to:
      target: {id: atmosphereShareDocumentPreview, within: {id: atmosphereShareCard}}
      direction: down
  - await:
      visible: {id: atmosphereShareDocumentPreview, within: {id: atmosphereShareCard}}
  - tap: {id: atmosphereShareDocumentPreview, within: {id: atmosphereShareCard}}
  - await: {visible: {text: 'How should we open this link?'}}
  - await: {idle: true}
  - tap: {text: Cancel}
  - await: {hidden: {text: 'How should we open this link?'}}
  - await:
      visible: {id: atmosphereShareDocumentPreview, within: {id: atmosphereShareCard}}
  - await: {idle: true}
  - tap: {id: atmosphereDocumentMenu, within: {id: atmosphereShareCard}}
  - await: {visible: {text: View author}}
  - await: {idle: true}
  - tap: {text: View author}
  - await: {visible: {id: profileHeaderDropdownBtn}}
  - await: {idle: true}
