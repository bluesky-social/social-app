executionPrerequisite: >-
  Instrumented signed-in English iOS app on Atmosphere, at or below the first
  multi-photo Gallery, with no overlay open. The loaded feed contains a multi-photo
  group and a standalone photo below it. Photo galleries are capped at ten usable
  images. Live-data fragment; image identity and cap are also reviewed visually.
steps:
  - echo: Find the capped Gallery, swipe horizontally, open and page its lightbox, use Close, then check the standalone photo below.
  - scroll-to:
      target: {id: atmospherePhotoGallery}
      direction: up
  - swipe:
      from: {id: atmospherePhotoGallery}
      by: {x: -0.4}
      momentum: false
  - tap: {id: atmospherePhotoGallery}
  - run: atmosphere-lightbox-visible-task10.yaml
  - echo: Page the full-screen lightbox with a left flick. Native discovery confirmed its unlabeled RNCPagerViewComponentView fills the screen; shared code stays unchanged. Require Close to remain visible afterward.
  - swipe: left
  - run: atmosphere-lightbox-visible-task10.yaml
  - tap: {text: Close image}
  - run: atmosphere-lightbox-closed-task10.yaml
  - scroll-to:
      target: {id: atmosphereSinglePhoto}
      direction: down
  - tap: {id: atmosphereSinglePhoto}
  - run: atmosphere-lightbox-visible-task10.yaml
  - tap: {text: Close image}
  - run: atmosphere-lightbox-closed-task10.yaml
