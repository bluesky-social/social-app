executionPrerequisite: >-
  Instrumented iOS development app on Atmosphere at the top, English locale,
  with local API data containing a document with usable related recommendations
  on the first loaded page.
steps:
  - echo: Scroll to a document's related recommendation proof, preserving feed order.
  - scroll-to:
      target: {id: atmosphereArticleRecommendations}
      direction: down
  # UITextView exposes this id to the native hierarchy, but not the AX projection.
  # The live text check was recorded after reaching the same recommendation row.
  - await: {visible: {text: recommended}}
