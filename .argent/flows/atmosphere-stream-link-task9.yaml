executionPrerequisite: >-
  Instrumented signed-in English iOS app on Atmosphere with browser preference
  unset. The non-persisted task-9 fixture cache is installed: a visible active
  stream card has a real source URL and appview thumbnail. No backend/account
  mutations. Restore the original query cache after testing.
steps:
  - await: {visible: {id: atmosphereLivestreamTitle}}
  - tap: {id: atmosphereLivestreamTitle}
  - await: {visible: {text: 'How should we open this link?'}}
  - await: {idle: true}
  - tap: {text: Cancel}
  - await: {hidden: {text: 'How should we open this link?'}}
  - await: {visible: {id: atmosphereLivestreamTitle}}
  - await: {idle: true}
