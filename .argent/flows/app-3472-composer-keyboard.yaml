executionPrerequisite: Android phone, signed in to the Bluesky development app on Home,
  keyboard closed, composeFAB visible. The empty composer is cancelled without publishing.
steps:
  - await: {visible: {id: composeFAB}}
  - await: {idle: true}
  - echo: Open an empty composer. Check initial autofocus before any keyboard toggle.
  - tap: {id: composeFAB}
  - await: {visible: {id: composerTextInput}}
  - await: {idle: true}
  - await: {visible: {id: 'android:id/input_method_nav_back'}}
  - await: {visible: {id: openMediaBtn}}
  - await: {visible: {id: openCameraButton}}
  - await: {visible: {id: openGifBtn}}
  - snapshot: {name: initial-keyboard-toolbar, maxMismatch: 0.1}
  - tap: {text: Cancel}
  - await: {hidden: {id: composerTextInput}}
  - await: {hidden: {id: 'android:id/input_method_nav_back'}}
  - await: {visible: {id: composeFAB}}
  - await: {idle: true}
