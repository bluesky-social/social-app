executionPrerequisite: >-
  Instrumented iOS development app signed in on the English Home feed, drawer
  closed, with the local Atmosphere API running. A document with a usable author
  and its menu must be visible in the initial Atmosphere viewport.
steps:
  - echo: Open the drawer from Home and enter Atmosphere.
  - tap: {text: Open drawer menu}
  - await: {visible: {id: menuItemButton-Atmosphere}}
  - await: {idle: true}
  - tap: {id: menuItemButton-Atmosphere}
  # AX and native view roles differ for the screen title; retain the live check.
  - tool: await-ui-element
    args:
      condition: visible
      selector: {text: Atmosphere, role: StaticText}
  - await: {visible: {id: atmosphereDocumentMenu}}
  - await: {idle: true}
  - echo: Open a document menu, not the external article.
  - tap: {id: atmosphereDocumentMenu}
  - await: {visible: {text: Report this}}
  - await: {idle: true}
  - echo: View author should close the menu and open the document author's profile.
  - tap: {text: View author}
  - await: {visible: {id: profileHeaderDropdownBtn}}
  - await: {idle: true}
