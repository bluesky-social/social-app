executionPrerequisite: >-
  Instrumented signed-in English iOS app at the top of Atmosphere. The first
  document with related recommendations in the loaded local feed also has a
  usable related share.
steps:
  - echo: Find the document with separate recommendation and share proof, then open its related post.
  - run: atmosphere-related-proof-task6.yaml
  - scroll-to:
      target: {id: atmosphereShareQuote, within: {id: atmosphereArticleCard}}
      direction: down
  - await:
      visible: {id: atmosphereShareQuote, within: {id: atmosphereArticleCard}}
  - tap: {id: atmosphereShareQuote, within: {id: atmosphereArticleCard}}
  - await: {visible: {text: Thread options}}
  - await: {idle: true}
