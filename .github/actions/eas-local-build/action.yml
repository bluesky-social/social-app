---
name: Local EAS Build
description: Build an Expo app locally with a selected EAS profile.

inputs:
  platform:
    description: EAS platform to build (ios or android)
    required: true
  profile:
    description: EAS build profile
    required: true
  output:
    description: Output path for the local build artifact
    required: true
  log-path:
    description: Optional path to tee build output into
    required: false
    default: ""
  bump-build-number:
    description: Run the build through use-build-number-with-bump
    required: false
    default: "false"
  sentry-auth-token:
    description: Optional Sentry authentication token
    required: false
    default: ""
  sentry-release:
    description: Optional Sentry release
    required: false
    default: ""
  sentry-dist:
    description: Optional Sentry distribution
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The runner image doesn't ship the NDK version React Native pins, and since
    # 2026-10-28 AGP's automatic install of it fails with "Archive is not a ZIP
    # archive" while sdkmanager installs the same package fine. Installing it
    # up front means AGP finds it and skips its own download.
    - name: Install the Android NDK
      if: inputs.platform == 'android'
      shell: bash
      run: |
        ndk_version=$(sed -n 's/^ndkVersion = "\(.*\)"$/\1/p' node_modules/react-native/gradle/libs.versions.toml)
        echo "Installing NDK $ndk_version"
        if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version" < <(yes) > "$RUNNER_TEMP/sdkmanager.log"; then
          cat "$RUNNER_TEMP/sdkmanager.log"
          exit 1
        fi
        cat "$ANDROID_HOME/ndk/$ndk_version/source.properties"

    - name: Build locally with EAS
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        PROFILE: ${{ inputs.profile }}
        OUTPUT: ${{ inputs.output }}
        LOG_PATH: ${{ inputs.log-path }}
        BUMP_BUILD_NUMBER: ${{ inputs.bump-build-number }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
        SENTRY_RELEASE: ${{ inputs.sentry-release }}
        SENTRY_DIST: ${{ inputs.sentry-dist }}
      run: |
        set -o pipefail
        build_command=(
          pnpm eas build
          --platform "$PLATFORM"
          --profile "$PROFILE"
          --local
          --output "$OUTPUT"
          --non-interactive
        )

        if [ -n "$LOG_PATH" ]; then
          mkdir -p "$(dirname "$LOG_PATH")"
          if [ "$BUMP_BUILD_NUMBER" = "true" ]; then
            pnpm use-build-number-with-bump "${build_command[@]}" 2>&1 | tee "$LOG_PATH"
          else
            "${build_command[@]}" 2>&1 | tee "$LOG_PATH"
          fi
        elif [ "$BUMP_BUILD_NUMBER" = "true" ]; then
          pnpm use-build-number-with-bump "${build_command[@]}"
        else
          "${build_command[@]}"
        fi
