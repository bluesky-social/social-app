name: Restore release artifact
description: Find an immutable artifact in this run, failing on API errors or expired evidence
inputs:
  name:
    description: Exact artifact name
    required: true
  path:
    description: Destination directory
    required: true
outputs:
  artifact-id:
    description: Artifact ID, or empty only when no artifact exists
    value: ${{ steps.lookup.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Look up recovery artifact
      id: lookup
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_NAME: ${{ inputs.name }}
      run: node scripts/release/recovery.mjs lookup "$ARTIFACT_NAME"
    - name: Download recovery artifact
      if: steps.lookup.outputs.artifact-id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.lookup.outputs.artifact-id }}
        path: ${{ inputs.path }}
