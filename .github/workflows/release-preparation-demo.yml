---
name: Release Preparation Demo
run-name: Release preparation simulation

on:
  pull_request:
    paths:
      - scripts/release/**
      - docs/release-model.md
      - docs/release-preparation/**
      - .github/workflows/release-preparation-demo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: Simulate release preparation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
      - name: Generate and verify fixture scenarios
        run: node scripts/release/prepare-demo.mjs --output release-preparation-demo
      - name: Verify committed example is current
        run: diff -u docs/release-preparation/example.md release-preparation-demo/README.md
      - name: Write reviewer summary
        run: cat release-preparation-demo/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reviewer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preparation-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-preparation-demo/
          retention-days: 30
          if-no-files-found: error
