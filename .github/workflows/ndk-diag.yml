# Temporary diagnostic for APP-3725: the NDK 27.1 auto-install on the Android
# build runner fails with "Archive is not a ZIP archive". Delete after use.
name: NDK download diagnostic

on:
  push:
    branches:
      - samuel/app-3725-ndk-diag

permissions:
  contents: read

jobs:
  diag:
    runs-on: Linux-x64-32core
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Preinstall the NDK with sdkmanager
        run: |
          ls "$ANDROID_HOME/ndk" || true
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SM" --version
          yes | "$SM" --install "ndk;27.1.12297006" | tr '\r' '\n' | grep -v -E '^\[=*' | tail -20
          cat "$ANDROID_HOME/ndk/27.1.12297006/source.properties"
          ls "$ANDROID_HOME/ndk"
