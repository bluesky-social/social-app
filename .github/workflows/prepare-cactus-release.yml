---
name: Prepare Cactus Release
run-name: ${{ inputs.dryRun && 'Dry run' || 'Prepare' }} release ${{ inputs.releaseVersion }} from ${{ inputs.sourceRef }}

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (preview only; do not create the release or start builds)
        type: boolean
        default: false
      releaseVersion:
        description: Release version (x.y.z; must match the source)
        required: true
        type: string
      sourceRef:
        description: Source branch, tag, or commit
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-preparation-${{ inputs.releaseVersion }}
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.dryRun }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sourceRef }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: tooling/package.json
      - name: Check release and print dry run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        with:
          retries: 0
          script: |
            const root = `${process.env.GITHUB_WORKSPACE}/tooling/scripts/release`
            const {prepareRelease, renderReport} = await import(`${root}/prepare.mjs`)
            const {dryRunRelease} = await import(`${root}/plan.mjs`)
            const repository = `${context.repo.owner}/${context.repo.repo}`
            const read = async path => (await github.request(`GET /repos/${repository}${path ? `/${path}` : ''}`, {
              request: {timeout: 30000},
            })).data
            let report = prepareRelease('source', process.env.RELEASE_VERSION)
            try {
              report = await dryRunRelease(report, repository, read)
              if (report.execution.status === 'blocked') core.setFailed(report.execution.reason)
            } finally {
              await core.summary.addRaw(renderReport(report)).write()
            }

  prepare:
    if: ${{ !inputs.dryRun && github.ref == 'refs/heads/main' && github.repository == 'bluesky-social/social-app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sourceRef }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Require source from main history
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: git -C source merge-base --is-ancestor HEAD "$TOOLING_SHA"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: tooling/package.json
      - name: Create draft release and dispatch builds
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        with:
          retries: 0
          script: |
            const root = `${process.env.GITHUB_WORKSPACE}/tooling/scripts/release`
            const {prepareRelease, renderReport} = await import(`${root}/prepare.mjs`)
            const {executeRelease} = await import(`${root}/execute.mjs`)
            const repository = `${context.repo.owner}/${context.repo.repo}`
            const read = async path => (await github.request(`GET /repos/${repository}${path ? `/${path}` : ''}`, {
              request: {timeout: 30000},
            })).data
            const write = async (method, path, body) => (await github.request(`${method} /repos/${repository}/${path}`, {
              data: body,
              headers: {'X-GitHub-Api-Version': '2022-11-28'},
              request: {timeout: 30000},
            })).data
            let report = prepareRelease('source', process.env.RELEASE_VERSION)
            try {
              report = await executeRelease(report, repository, {read, write})
              if (report.execution.status === 'blocked') core.setFailed(report.execution.reason)
            } finally {
              await core.summary.addRaw(renderReport(report)).write()
            }
