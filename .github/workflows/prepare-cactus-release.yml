---
name: Prepare Cactus Release (dry run)
run-name: Dry run release ${{ inputs.releaseVersion }} from ${{ inputs.sourceRef }}

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: Release version (x.y.z; must match the source)
        required: true
        type: string
      sourceRef:
        description: Source branch, tag, or commit
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'bluesky-social/social-app'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sourceRef }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: tooling/package.json
      - name: Check release and print dry run
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          node tooling/scripts/release/prepare.mjs "$RELEASE_VERSION" source release-preparation
          cat release-preparation/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report and release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-preparation/
          retention-days: 14
          if-no-files-found: error
