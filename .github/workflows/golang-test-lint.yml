name: golang

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Temporary until fixed runner images roll out:
      # https://github.com/actions/runner-images/issues/15018
      - name: Update Ubuntu CA certificates
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade --no-install-recommends -y ca-certificates

      - name: ⬇️ Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🔧 Set up Go tooling
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/web/go.mod
          cache-dependency-path: services/web/go.sum
      - name: 📄 Dummy Static Files
        run: |
          mkdir -p services/web/static/_expo services/web/static/assets
          touch services/web/static/_expo/blah.js services/web/static/assets/blah.txt
          touch services/web/templates/scripts.html services/web/templates/fonts.html
      - name: 🔍 Check
        run: cd services/web/ && make check
      - name: 🏗️ Build (binary)
        run: cd services/web/ && make build
      - name: 🧪 Test
        run: cd services/web/ && make test
  lint:
    runs-on: ubuntu-latest
    steps:
      # Temporary until fixed runner images roll out:
      # https://github.com/actions/runner-images/issues/15018
      - name: Update Ubuntu CA certificates
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade --no-install-recommends -y ca-certificates

      - name: ⬇️ Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🔧 Set up Go tooling
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/web/go.mod
          cache-dependency-path: services/web/go.sum
      - name: 📄 Dummy Static Files
        run: |
          mkdir -p services/web/static/_expo services/web/static/assets
          touch services/web/static/_expo/blah.js services/web/static/assets/blah.txt
          touch services/web/templates/scripts.html services/web/templates/fonts.html
      - name: 🧹 Lint
        run: cd services/web/ &&  make lint
