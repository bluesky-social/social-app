steps:
  - tool: open-url
    args:
      url: fasttextbench://run?group=library
executionPrerequisite: "Unprofiled Release app installed and idle. Collector
  listening on host port 8124; Android has adb reverse tcp:8124 tcp:8124. This
  flow ONLY starts the run: wait for a new collector result before further
  device actions. Do not poll the accessibility tree, build, or analyze during
  measurement."
