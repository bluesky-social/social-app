steps:
  - tool: debugger-evaluate
    args:
      port: 8083
      expression: void
        globalThis.__FAST_TEXT_BENCHMARK__.run({renderers:['react-native','plain-text','fast-text'],workloads:['label','lingui','fragments','nested'],count:400,rounds:4,warmups:1});
        'started'
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: "Complete:"
      timeoutMs: 60000
      pollIntervalMs: 2000
executionPrerequisite: Fast Text Benchmark debug app ready, Metro on 8083,
  collector on 8124, no benchmark in progress.
