plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.backgroundnotificationhandler'
version = '0.5.0'

android {
  namespace "expo.modules.backgroundnotificationhandler"
  defaultConfig {
    versionCode 1
    versionName "0.5.0"
  }
}

dependencies {
  /*
   * expo-notifications ships a prebuilt AAR, and only becomes a Gradle project
   * when it's listed in `expo.autolinking.android.buildFromSource` in the app's
   * package.json. Keep it there, or this dependency won't resolve.
   */
  implementation project(':expo-notifications')
  // Keep in step with expo-notifications' own firebase-messaging version
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
