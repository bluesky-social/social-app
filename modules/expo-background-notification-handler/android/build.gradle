plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.backgroundnotificationhandler'
version = '0.5.0'

android {
  namespace "expo.modules.backgroundnotificationhandler"
  defaultConfig {
    versionCode 1
    versionName "0.5.0"
  }
}

dependencies {
  implementation project(':expo-notifications')
  // Keep in step with expo-notifications' own firebase-messaging version
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
