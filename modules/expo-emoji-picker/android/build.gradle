plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.community.modules.emojipicker'
version = '0.1.0'

android {
  namespace "expo.community.modules.emojipicker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.emoji2:emoji2-emojipicker:1.5.0"
}
