appId: xyz.blueskyweb.app
---
- runScript:
    file: ../setupServer.js
    env:
      SERVER_PATH: ?users
- runFlow:
    file: ../setupApp.yml
- tapOn:
    id: "e2eSignInAlice"
- extendedWaitUntil:
    visible:
      id: "viewHeaderHomeFeedPrefsBtn"

- assertVisible:
    id: "composeFAB"
- tapOn:
    id: "composeFAB"
- inputText: "Post text only"
- tapOn:
    id: "composerPublishBtn"
- assertVisible:
    id: "composeFAB"
- tapOn:
    id: "composeFAB"
- inputText: "Post with an image"
- tapOn:
    id: "openMediaBtn"
- extendedWaitUntil:
    visible:
      id: "selectedPhotosView"
- tapOn:
    id: "composerPublishBtn"
- assertVisible:
    id: "composeFAB"
- tapOn:
    id: "composeFAB"
- inputText: "Post with a https://example.com link card"
- tapOn:
    id: "composerPublishBtn"
- assertVisible:
    id: "composeFAB"
- tapOn:
    id: "e2eRefreshHome"
# Following v2 (always on in e2e builds) can keep the reader where they were
# and put the refreshed posts above them, out of view - it does on Android.
# Scroll up to the newest post, or the first replyBtn is one scrolled up under
# the header.
- scrollUntilVisible:
    element:
      text: "Post with a .*link card"
    direction: UP
- tapOn:
    id: "replyBtn"
# Wait for the composer to fully open before typing. Tapping replyBtn right
# after the previous publish can race the closing composer on Android.
- extendedWaitUntil:
    visible:
      id: "composerPublishBtn"
    timeout: 10000
- inputText: "Reply text only"
- tapOn:
    id: "composerPublishBtn"
- assertVisible:
    id: "composeFAB"
- tapOn:
    id: "replyBtn"
# Wait for the composer to fully open before typing.
- extendedWaitUntil:
    visible:
      id: "composerPublishBtn"
    timeout: 10000
- inputText: "Reply with an image"
- tapOn:
    id: "openMediaBtn"
- extendedWaitUntil:
    visible:
      id: "selectedPhotosView"
- tapOn:
    id: "composerPublishBtn"
- assertVisible:
    id: "composeFAB"
- tapOn:
    id: "replyBtn"
# Wait for the composer to fully open before typing.
- extendedWaitUntil:
    visible:
      id: "composerPublishBtn"
    timeout: 10000
- inputText: "Reply with a https://example.com link card"
- tapOn:
    id: "composerPublishBtn"
- assertVisible:
    id: "composeFAB"
- tapOn:
    id: "repostBtn"
- tapOn:
    id: "quoteBtn"
- inputText: "QP text only"
- tapOn:
    id: "composerPublishBtn"
- assertVisible:
    id: "composeFAB"
- tapOn:
    id: "repostBtn"
- tapOn:
    id: "quoteBtn"
- inputText: "QP with an image"
- tapOn:
    id: "openMediaBtn"
- extendedWaitUntil:
    visible:
      id: "selectedPhotosView"
- tapOn:
    id: "composerPublishBtn"
- assertVisible:
    id: "composeFAB"
- tapOn:
    id: "repostBtn"
- tapOn:
    id: "quoteBtn"
- inputText: "QP with a https://example.com link card"
- tapOn:
    id: "composerPublishBtn"
- assertVisible:
    id: "composeFAB"
