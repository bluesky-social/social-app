appId: xyz.blueskyweb.app
---
- runScript:
    file: ../setupServer.js
    env:
      SERVER_PATH: ""
- runFlow:
    file: ../setupApp.yml
- tapOn:
    id: "e2eOpenLoggedOutView"
- tapOn:
    id: "createAccountButton"
- tapOn: "Bluesky Social"
- tapOn:
    id: "customSelectBtn"
- tapOn:
    id: "customServerTextInput"
- inputText: "http://localhost:3000"
- pressKey: Enter
- tapOn:
    id: "doneBtn"
- tapOn:
    id: "emailInput"
- inputText: "example@test.com"
- tapOn:
    id: "passwordInput"
- inputText: "hunter22"
- tapOn:
    # hideKeyboard on ios is borked
    # https://docs.maestro.dev/troubleshooting/known-issues#hidekeyboard-command-is-flaky
    text: "Your account"
- tapOn: "Date of birth"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      # Keep the current month and day; only move the year back to 2007.
      - repeat:
          times: 100
          while:
            notVisible: "2007"
          commands:
            - tapOn:
                text: "[0-9]{4}"
                point: "50%,40%"
      - assertVisible: "2007"
      - tapOn: "Done"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Switch to selecting a year"
      - scrollUntilVisible:
          element:
            text: "2007"
          direction: DOWN
      - tapOn: "2007"
      # Selecting a year changes the displayed month, not the selected date.
      - tapOn: "${new Date().getDate()}"
      - tapOn: "OK"
- tapOn:
    id: "nextBtn"
- waitForAnimationToEnd
- tapOn:
    # save password thing no longer seems to be in hierarchy
    # tap on something else instead
    point: 20%,20%
    repeat: 2
    delay: 1000
- tapOn:
    id: "handleInput"
- inputText: "e2e-test"
- extendedWaitUntil:
    visible:
      id: "handleAvailableCheck"
- tapOn:
    id: "nextBtn"
- assertVisible: "Give your profile a face"
