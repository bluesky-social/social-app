nodeLinker: 'hoisted'
autoInstallPeers: true # default: true
strictPeerDependencies: false # default: false
packageExtensions:
  eslint-plugin-react-native-a11y:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-simple-import-sort:
    peerDependenciesMeta:
      eslint:
        optional: true
trustPolicy: 'no-downgrade' # default: off
trustPolicyIgnoreAfter: 10080 # 7 days, default: undefined
pmOnFail: download # run the pnpm version pinned in devEngines; package.json keeps onFail: warn because npm/npx read it too
overrides:
  '@react-native/babel-preset': '0.88.1'
  '@react-native/normalize-colors': '0.88.1'
  '@expo/image-utils': '0.12.6'
  'expo-modules-core': '58.0.30'
  '@types/estree': '1.0.6'
  'react-native-reanimated': '4.7.1'
  'react-native-worklets': '0.13.0'
  'psl': '1.9.0'
  '@types/psl': '1.1.1'
  'react-native-screens': '4.30.1'
allowBuilds:
  '@sentry/cli': true
  '@swc/core': false
  'core-js': false
  'core-js-pure': false
  'dtrace-provider': false
  'esbuild': false
  '@parcel/watcher': false
  'protobufjs': false
  'unrs-resolver': true
patchedDependencies:
  '@expo/cli@58.1.19': patches/@expo__cli@58.1.19.patch
  '@expo/ui@58.0.27': patches/@expo__ui@58.0.27.patch
  '@formatjs/bigdecimal@0.2.5': patches/@formatjs__bigdecimal@0.2.5.patch
  '@sentry/expo-upload-sourcemaps@8.26.0': patches/@sentry__expo-upload-sourcemaps@8.26.0.patch
  'expo-image@58.0.18': patches/expo-image@58.0.18.patch
  'expo-media-library@58.0.13': patches/expo-media-library@58.0.13.patch
  'expo-modules-core@58.0.30': patches/expo-modules-core@58.0.30.patch
  expo-notifications@58.1.8: patches/expo-notifications@58.1.8.patch
  expo-updates@58.0.21: patches/expo-updates@58.0.21.patch
  expo-widgets@58.0.27: patches/expo-widgets@58.0.27.patch
  expo@58.0.23: patches/expo@58.0.23.patch
  'metro-runtime@0.87.1': patches/metro-runtime@0.87.1.patch
  'metro@0.87.1': patches/metro@0.87.1.patch
  react-native-keyboard-controller@1.22.7: patches/react-native-keyboard-controller@1.22.7.patch
  react-native-nano-icons@1.0.1: patches/react-native-nano-icons@1.0.1.patch
  react-native-pager-view@9.0.11: patches/react-native-pager-view@9.0.11.patch
  react-native-reanimated@4.7.1: patches/react-native-reanimated@4.7.1.patch
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
  'react-native-svg@15.16.0': patches/react-native-svg@15.16.0.patch
  react-native@0.88.1: patches/react-native@0.88.1.patch
minimumReleaseAgeExclude:
  - '@atproto/*'
  - '@atproto-labs/*'
  - '@bsky.app/*'
  - '@bsky/*'
  - react-native-nano-icons@1.0.1
  - '@expo/cli@58.1.19'
  - '@expo/config-plugins@58.0.12'
  - '@expo/config@58.0.11'
  - '@expo/env@2.5.4'
  - '@expo/fingerprint@0.21.9'
  - '@expo/inline-modules@0.2.9'
  - '@expo/local-build-cache-provider@58.0.11'
  - '@expo/log-box@58.0.15'
  - '@expo/metro-config@58.0.21'
  - '@expo/metro-runtime@58.0.17'
  - '@expo/prebuild-config@58.0.19'
  - '@expo/router-server@58.0.21'
  - '@expo/ui@58.0.27'
  - babel-preset-expo@58.0.24
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-linking@58.0.16
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo-notifications@58.1.8
  - expo-screen-orientation@58.0.4
  - expo-sharing@58.0.22
  - expo-splash-screen@58.0.13
  - expo-updates@58.0.21
  - expo-widgets@58.0.27
  - expo@58.0.23
  - jest-expo@58.0.14
