nodeLinker: 'hoisted'
autoInstallPeers: true # default: true
strictPeerDependencies: false # default: false
packageExtensions:
  eslint-plugin-react-native-a11y:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-simple-import-sort:
    peerDependenciesMeta:
      eslint:
        optional: true
trustPolicy: 'no-downgrade' # default: off
trustPolicyIgnoreAfter: 10080 # 7 days, default: undefined
pmOnFail: download # run the pnpm version pinned in devEngines; package.json keeps onFail: warn because npm/npx read it too
overrides:
  '@react-native/babel-preset': '0.88.0'
  '@react-native/normalize-colors': '0.88.0'
  '@expo/image-utils': '0.12.5'
  '@types/estree': '1.0.6'
  'react-native-reanimated': '4.7.1'
  'react-native-worklets': '0.13.0'
  'psl': '1.9.0'
  '@types/psl': '1.1.1'
  'react-native-screens': '4.30.0'
allowBuilds:
  '@sentry/cli': true
  '@swc/core': false
  'core-js': false
  'core-js-pure': false
  'dtrace-provider': false
  'esbuild': false
  '@parcel/watcher': false
  'protobufjs': false
  'unrs-resolver': true
patchedDependencies:
  '@expo/cli@58.1.14': patches/@expo__cli@58.1.14.patch
  '@expo/ui@58.0.22': patches/@expo__ui@58.0.22.patch
  '@formatjs/bigdecimal@0.2.5': patches/@formatjs__bigdecimal@0.2.5.patch
  '@sentry/expo-upload-sourcemaps@8.26.0': patches/@sentry__expo-upload-sourcemaps@8.26.0.patch
  'expo-image@58.0.15': patches/expo-image@58.0.15.patch
  'expo-media-library@58.0.10': patches/expo-media-library@58.0.10.patch
  'expo-modules-core@58.0.22': patches/expo-modules-core@58.0.22.patch
  expo-notifications@58.1.5: patches/expo-notifications@58.1.5.patch
  expo-updates@58.0.17: patches/expo-updates@58.0.17.patch
  expo-widgets@58.0.22: patches/expo-widgets@58.0.22.patch
  expo@58.0.14: patches/expo@58.0.14.patch
  'metro-runtime@0.87.1': patches/metro-runtime@0.87.1.patch
  'metro@0.87.1': patches/metro@0.87.1.patch
  react-native-keyboard-controller@1.22.7: patches/react-native-keyboard-controller@1.22.7.patch
  react-native-pager-view@9.0.9: patches/react-native-pager-view@9.0.9.patch
  react-native-reanimated@4.7.1: patches/react-native-reanimated@4.7.1.patch
  react-native-safe-area-context@5.10.1: patches/react-native-safe-area-context@5.10.1.patch
  react-native-screens@4.30.0: patches/react-native-screens@4.30.0.patch
  'react-native-svg@15.16.0': patches/react-native-svg@15.16.0.patch
  react-native@0.88.0: patches/react-native@0.88.0.patch
minimumReleaseAgeExclude:
  - '@atproto/*'
  - '@atproto-labs/*'
  - '@bsky.app/*'
  - '@bsky/*'
  - react-native-nano-icons@1.0.1
