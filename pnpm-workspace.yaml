nodeLinker: 'hoisted'
autoInstallPeers: true # default: true
strictPeerDependencies: false # default: false
packageExtensions:
  eslint-plugin-react-native-a11y:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-simple-import-sort:
    peerDependenciesMeta:
      eslint:
        optional: true
trustPolicy: 'no-downgrade' # default: off
trustPolicyIgnoreAfter: 10080 # 7 days, default: undefined
overrides:
  '@react-native/babel-preset': '0.86.3'
  '@react-native/normalize-colors': '0.86.3'
  '@expo/image-utils': '0.8.12'
  '@types/estree': '1.0.6'
  'react-native-reanimated': '4.6.0'
  'react-native-worklets': '0.12.2'
  'psl': '1.9.0'
  '@types/psl': '1.1.1'
  'react-native-screens': '4.26.2'
allowBuilds:
  '@sentry/cli': true
  'core-js': false
  'core-js-pure': false
  'esbuild': false
  'unrs-resolver': true
patchedDependencies:
  '@expo/cli@57.0.26': patches/@expo__cli@57.0.26.patch
  '@formatjs/bigdecimal@0.2.5': patches/@formatjs__bigdecimal@0.2.5.patch
  '@sentry/expo-upload-sourcemaps@8.18.0': patches/@sentry__expo-upload-sourcemaps@8.18.0.patch
  'expo-age-range@57.0.2': patches/expo-age-range@57.0.2.patch
  'expo-haptics@57.0.3': patches/expo-haptics@57.0.3.patch
  'expo-media-library@57.0.5': patches/expo-media-library@57.0.5.patch
  'expo-modules-core@57.0.18': patches/expo-modules-core@57.0.18.patch
  expo-notifications@57.0.20: patches/expo-notifications@57.0.20.patch
  expo-updates@57.0.23: patches/expo-updates@57.0.23.patch
  expo@57.0.24: patches/expo@57.0.24.patch
  'react-native-date-picker@5.0.13': patches/react-native-date-picker@5.0.13.patch
  'react-native-drawer-layout@4.2.3': patches/react-native-drawer-layout@4.2.3.patch
  'react-native-keyboard-controller@1.21.9': patches/react-native-keyboard-controller@1.21.9.patch
  'react-native-pager-view@6.8.0': patches/react-native-pager-view@6.8.0.patch
  'react-native-screens@4.26.2': patches/react-native-screens@4.26.2.patch
  'react-native-svg@15.15.4': patches/react-native-svg@15.15.4.patch
  'react-native@0.86.3': patches/react-native@0.86.3.patch
minimumReleaseAgeExclude:
  - '@atproto/*'
  - '@atproto-labs/*'
  - '@bsky.app/*'
  - '@bsky/*'
  - react-native-worklets@0.12.2
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.24
  - expo-build-properties@57.0.21
  - expo-image-manipulator@57.0.19
  - expo-image-picker@57.0.19
  - expo-location@57.0.19
  - expo-notifications@57.0.20
  - expo-sharing@57.0.21 # TODO
